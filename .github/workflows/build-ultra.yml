name: build-ultra-apk

# Agent 版 + armor（破甲）构建：
#   源码就是本仓库自己的分支，不再 checkout 上游再打补丁 —— armor 的改动是提交进来的，
#   谁都能看到改了什么、哪一行接的线。
#   出 debug APK（debug 签名，自用），顺带跑 armor 的单测，判定逻辑改坏了当场红。
# 只手动触发：改代码期间不占用 Actions 额度，也不在你没准备好时出包。
# 要出包时到 Actions 页面点 Run workflow，或告我一声我帮你触发。
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ultra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record revision
        run: |
          set -e
          echo "commit: $(git rev-parse HEAD)"
          git log -1 --format='%h %ad %s' --date=short
          echo "--- submodules ---"
          git submodule status

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install SDK packages
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          echo "SDK=$SDK"
          echo "SDKM=$SDKM"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          "$SDKM" "platforms;android-37.2" || "$SDKM" "platforms;android-37"
          "$SDKM" "build-tools;37.0.0"
          "$SDKM" "cmake;3.22.1"
          "$SDKM" "ndk;29.0.14206865"
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- ndk ---"
          ls "$SDK/ndk" || true

      - name: Gradle properties
        run: |
          set -e
          echo "android.ndkVersion=29.0.14206865" >> gradle.properties
          cat gradle.properties

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: web-ui dependencies (bun)
        working-directory: web-ui
        run: |
          set -e
          bun --version
          bun install --frozen-lockfile

      - name: web-ui bundle (pnpm)
        working-directory: web-ui
        run: |
          set -e
          pnpm --version
          pnpm run build

      - name: List unit-test tasks
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:tasks --all 2>&1 | grep -iE "unittest|test.*Debug" | head -n 40 \
            | tee /tmp/test-tasks.log || true
          cat /tmp/test-tasks.log

      - name: Armor unit tests
        run: |
          set -o pipefail
          chmod +x gradlew
          # 本 fork 没有 distribution flavor（那是上游 3.1.1 才有的），
          # 变体只有一个 debug，任务名是 testDebugUnitTest。
          #
          # --tests 过滤器在没有匹配测试时会直接判失败（No tests found）。
          # main 分支上还没有 armor 移植，所以先看源文件在不在，避免"选错分支"看起来像编译错误。
          if ls app/src/test/java/me/rerere/rikkahub/data/ai/armor/*.kt >/dev/null 2>&1; then
            ./gradlew :app:testDebugUnitTest \
              --tests "me.rerere.rikkahub.data.ai.armor.*" \
              --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee /tmp/armor-test.log
          else
            echo "::warning::这个 ref 上没有 armor 单测（未移植 armor），跳过该步骤"
            echo "no armor tests on this ref: $(git rev-parse --short HEAD)" | tee /tmp/armor-test.log
          fi

      # 日志接口要 admin 权限，匿名读不到；失败时把尾部贴到公开 issue，
      # 这样不登录也能看到到底哪一行红的。
      - name: Publish failure log to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOG=/tmp/armor-test.log
          [ -f "$LOG" ] || LOG=/tmp/test-tasks.log
          [ -f "$LOG" ] || { echo "没有日志文件"; exit 0; }
          TITLE="CI failure: $(date -u +%Y-%m-%dT%H:%MZ) @ ${GITHUB_SHA:0:7}"
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo ""
            echo '```'
            tail -c 60000 "$LOG" | sed 's/\r$//'
            echo '```'
          } > /tmp/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: armor-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon --no-configuration-cache --stacktrace --warning-mode summary

      - name: Package APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M)"
          OUT="rikkahub-agent-armor-${STAMP}"
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::没有找到 APK"
            exit 1
          fi
          for f in "${apks[@]}"; do
            cp "$f" "dist/${OUT}-$(basename "$f")"
          done
          ls -lh dist/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: rikkahub-agent-armor-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
